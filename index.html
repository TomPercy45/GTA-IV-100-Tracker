<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA IV 100% Completion Tracker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialCategories = {
            story: {
                name: "Story Missions",
                weight: 60,
                tasks: [
                    { id: "story_all", name: "Complete All 88 Story Missions", max: 88, type: "counter" }
                ]
            },
            sideJobs: {
                name: "Side Jobs & Activities",
                weight: 10,
                tasks: [
                    { id: "jacob_deliveries", name: "Little Jacob Drug Deliveries", max: 10, type: "counter" },
                    { id: "brucie_exports", name: "Brucie Exotic Exports", max: 10, type: "counter" },
                    { id: "brucie_races", name: "Brucie Races", max: 9, type: "counter" },
                    { id: "stevie_cars", name: "Stevie's Car Thefts", max: 30, type: "counter" },
                    { id: "fixer_assassinations", name: "Fixer Assassinations", max: 9, type: "counter" }
                ]
            },
            friendships: {
                name: "Friendships & Abilities",
                weight: 10,
                tasks: [
                    { id: "friend_brucie", name: "Brucie (All Activities & Ability)", max: 1, type: "checkbox" },
                    { id: "friend_jacob", name: "Little Jacob (All Activities & Ability)", max: 1, type: "checkbox" },
                    { id: "friend_packie", name: "Packie (All Activities & Ability)", max: 1, type: "checkbox" }
                ]
            },
            randomChars: {
                name: "Random Characters",
                weight: 5,
                tasks: [
                    { id: "rand_brian", name: "Brian", max: 3, type: "counter" },
                    { id: "rand_badman", name: "Badman", max: 1, type: "checkbox" },
                    { id: "rand_mel", name: "Mel", max: 1, type: "checkbox" },
                    { id: "rand_ilyena", name: "Ilyena", max: 1, type: "checkbox" },
                    { id: "rand_hossan", name: "Hossan", max: 1, type: "checkbox" },
                    { id: "rand_pathos", name: "Pathos", max: 2, type: "counter" },
                    { id: "rand_sara", name: "Sara", max: 2, type: "counter" },
                    { id: "rand_marnie", name: "Marnie", max: 2, type: "counter" },
                    { id: "rand_eddie", name: "Eddie", max: 2, type: "counter" },
                    { id: "rand_gracie", name: "Gracie", max: 1, type: "checkbox" }
                ]
            },
            policeActivities: {
                name: "Police & Mini-Games",
                weight: 10,
                tasks: [
                    { id: "vigilante", name: "Vigilante Crimes (Police Computer)", max: 20, type: "counter" },
                    { id: "most_wanted", name: "Most Wanted Targets", max: 30, type: "counter" },
                    { id: "mini_pool", name: "Win Pool Game", max: 1, type: "checkbox" },
                    { id: "mini_darts", name: "Win Darts Game", max: 1, type: "checkbox" },
                    { id: "mini_bowling", name: "Win Full Bowling Game", max: 1, type: "checkbox" },
                    { id: "mini_qub3d", name: "QUB3D High Score (10,950)", max: 1, type: "checkbox" }
                ]
            },
            collectibles: {
                name: "Collectibles",
                weight: 5,
                tasks: [
                    { id: "pigeons", name: "Pigeons / Flying Rats", max: 200, type: "counter" },
                    { id: "stunt_jumps", name: "Unique Stunt Jumps", max: 50, type: "counter" }
                ]
            }
        };

        function App() {
            // Load saved progress from localStorage or initialize empty
            const [progress, setProgress] = useState(() => {
                const saved = localStorage.getItem('gta_iv_progress');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { /* fallback */ }
                }
                const initial = {};
                Object.keys(initialCategories).forEach(catKey => {
                    initial[catKey] = {};
                    initialCategories[catKey].tasks.forEach(task => {
                        initial[catKey][task.id] = 0;
                    });
                });
                return initial;
            });

            useEffect(() => {
                localStorage.setItem('gta_iv_progress', JSON.stringify(progress));
            }, [progress]);

            const updateTask = (catKey, taskId, value, max) => {
                const clampedValue = Math.max(0, Math.min(max, value));
                setProgress(prev => ({
                    ...prev,
                    [catKey]: {
                        ...prev[catKey],
                        [taskId]: clampedValue
                    }
                }));
            };

            const resetProgress = () => {
                if (window.confirm("Are you sure you want to reset all progress?")) {
                    const fresh = {};
                    Object.keys(initialCategories).forEach(catKey => {
                        fresh[catKey] = {};
                        initialCategories[catKey].tasks.forEach(task => {
                            fresh[catKey][task.id] = 0;
                        });
                    });
                    setProgress(fresh);
                }
            };

            // Calculate total global completion percentage
            let totalCompletion = 0;
            Object.keys(initialCategories).forEach(catKey => {
                const category = initialCategories[catKey];
                let catPointsEarned = 0;
                let catPointsMax = 0;

                category.tasks.forEach(task => {
                    const current = progress[catKey]?.[task.id] || 0;
                    catPointsEarned += current;
                    catPointsMax += task.max;
                });

                const catRatio = catPointsMax > 0 ? catPointsEarned / catPointsMax : 0;
                totalCompletion += catRatio * category.weight;
            });

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <header className="mb-8 text-center bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
                        <h1 className="text-3xl font-black text-amber-400 tracking-wider mb-2">GTA IV 100% TRACKER</h1>
                        <p className="text-slate-400 text-sm mb-6">Granular progress manager for Liberty City completionists.</p>
                        
                        {/* Overall Progress Bar */}
                        <div className="w-full bg-slate-700 h-6 rounded-full overflow-hidden p-1 mb-2">
                            <div 
                                className="bg-amber-500 h-full rounded-full transition-all duration-300 flex items-center justify-end pr-2 text-xs font-bold text-slate-900"
                                style={{ width: `${Math.min(100, totalCompletion)}%` }}
                            >
                                {totalCompletion >= 5 && `${totalCompletion.toFixed(1)}%`}
                            </div>
                        </div>
                        <div className="flex justify-between items-center text-sm font-semibold text-slate-300 px-1">
                            <span>Total Progress: <strong className="text-amber-400 text-lg">{totalCompletion.toFixed(1)}%</strong> / 100%</span>
                            <button 
                                onClick={resetProgress}
                                className="bg-red-900/50 hover:bg-red-800 text-red-200 px-3 py-1 rounded text-xs transition border border-red-700"
                            >
                                Reset Progress
                            </button>
                        </div>
                    </header>

                    {/* Category Sections */}
                    <div className="space-y-6">
                        {Object.keys(initialCategories).map(catKey => {
                            const category = initialCategories[catKey];
                            let earned = 0;
                            let maxPossible = 0;

                            category.tasks.forEach(t => {
                                earned += progress[catKey]?.[t.id] || 0;
                                maxPossible += t.max;
                            });

                            const catPercentage = maxPossible > 0 ? (earned / maxPossible) * 100 : 0;

                            return (
                                <div key={catKey} className="bg-slate-800/80 border border-slate-700 rounded-xl p-5 shadow-md">
                                    <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                                        <div>
                                            <h2 className="text-lg font-bold text-amber-300">{category.name}</h2>
                                            <span className="text-xs text-slate-400">Weight toward 100%: {category.weight}%</span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-sm font-bold text-slate-200">{earned} / {maxPossible}</span>
                                            <div className="text-xs text-amber-400 font-semibold">{catPercentage.toFixed(0)}% Done</div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {category.tasks.map(task => {
                                            const currentVal = progress[catKey]?.[task.id] || 0;
                                            const isComplete = currentVal >= task.max;

                                            return (
                                                <div 
                                                    key={task.id} 
                                                    className={`flex items-center justify-between p-3 rounded-lg border transition ${
                                                        isComplete ? 'bg-slate-900/40 border-amber-500/40' : 'bg-slate-900/85 border-slate-700'
                                                    }`}
                                                >
                                                    <span className={`text-sm pr-2 ${isComplete ? 'text-slate-300 line-through' : 'text-slate-100'}`}>
                                                        {task.name}
                                                    </span>

                                                    {task.type === 'checkbox' ? (
                                                        <input 
                                                            type="checkbox"
                                                            checked={currentVal === 1}
                                                            onChange={(e) => updateTask(catKey, task.id, e.target.checked ? 1 : 0, 1)}
                                                            className="w-5 h-5 accent-amber-500 rounded cursor-pointer"
                                                        />
                                                    ) : (
                                                        <div className="flex items-center space-x-2">
                                                            <button 
                                                                onClick={() => updateTask(catKey, task.id, currentVal - 1, task.max)}
                                                                className="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-amber-300 font-bold rounded flex items-center justify-center transition"
                                                            >
                                                                -
                                                            </button>
                                                            <span className="text-sm font-mono w-12 text-center text-amber-400">
                                                                {currentVal}/{task.max}
                                                            </span>
                                                            <button 
                                                                onClick={() => updateTask(catKey, task.id, currentVal + 1, task.max)}
                                                                className="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-amber-300 font-bold rounded flex items-center justify-center transition"
                                                            >
                                                                +
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
